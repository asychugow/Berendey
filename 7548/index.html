
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Анимация 7548</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(
        ellipse at 50% 25%,
        #292b40,
        #101116 70%
      );
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: black;
      border-radius: 20px;
      box-shadow: 0 18px 65px #0008;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #161722;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #ffffff25;
      color: white;
    }

    p {
      color: #c3c4cf;
      font-size: 13px;
      margin-top: 18px;
    }

    #status {
      color: #ffcc99;
    }
  </style>
</head>

<body>
  <main>

    <video
      id="movie"
      controls
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source
        src="https://asychugow.github.io/Berendey/7548/animation.MP4"
        type="video/mp4"
      >
      Ваш браузер не поддерживает видео.
    </video>

    <div class="buttons">
      <button onclick="playVideo()">
        ▶ Смотреть
      </button>

      <button onclick="toggleSound()" id="soundBtn">
        🔊 Включить звук
      </button>

      <button onclick="restartVideo()" class="secondary">
        ↻ Сначала
      </button>
    </div>

    <p>
      Видео повторяется по кругу.
      Звук включается отдельной кнопкой.
    </p>

    <p id="status"></p>

  </main>

  <script>
    const video = document.getElementById("movie");
    const soundBtn = document.getElementById("soundBtn");
    const status = document.getElementById("status");

    function playVideo() {
      video.play().catch(() => {
        status.textContent =
          "Не удалось запустить видео.";
      });
    }

    function toggleSound() {
      video.muted = !video.muted;

      soundBtn.textContent = video.muted
        ? "🔊 Включить звук"
        : "🔇 Выключить звук";

      playVideo();
    }

    function restartVideo() {
      video.currentTime = 0;
      playVideo();
    }

    video.addEventListener("error", () => {
      status.textContent =
        "Ошибка загрузки видео.";
    });

    video.addEventListener("loadedmetadata", () => {
      status.textContent = "";
    });

    video.play().catch(() => {
      status.textContent =
        "Нажмите «Смотреть» для запуска.";
    });
  </script>
</body>
</html>
