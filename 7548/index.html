<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121a"><title>Анимация</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 25%,#292b40,#101116 70%);color:#fff;display:grid;place-items:center;padding:22px}main{width:min(100%,900px);display:grid;justify-items:center;gap:18px}.frame{position:relative;width:100%;overflow:hidden;border-radius:20px;background:#000;box-shadow:0 18px 65px #0008}video{display:block;width:100%;height:auto;max-height:74svh;object-fit:contain}.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}button{border:1px solid #ffffff24;border-radius:999px;padding:14px 24px;background:#fff;color:#161722;font-size:16px;font-weight:650;cursor:pointer;min-height:50px}button.secondary{background:#ffffff17;color:#fff}button:focus-visible{outline:3px solid #a8a0ff;outline-offset:3px}.hint{margin:0;text-align:center;color:#c3c4cf;font-size:13px}#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009}#fallback button{font-size:18px}</style></head>
<body><main><div class="frame"><video id="movie" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-label="Анимированное видео"><source src="animation.mp4" type="video/mp4">Ваш браузер не поддерживает видео.</video><div id="fallback"><button id="start">▶ Смотреть</button></div></div><div class="controls"><button id="sound" type="button">🔊 Включить звук</button><button id="replay" type="button" class="secondary">↻ Сначала</button></div><p class="hint">Видео повторяется по кругу. Для воспроизведения со звуком нажмите «Включить звук».</p></main>
<script>
const movie=document.getElementById('movie'),sound=document.getElementById('sound'),replay=document.getElementById('replay'),fallback=document.getElementById('fallback');
function sync(){sound.textContent=movie.muted?'🔊 Включить звук':'🔇 Выключить звук'}
sound.addEventListener('click',()=>{movie.muted=!movie.muted;sync();movie.play().catch(()=>{fallback.style.display='flex'})});
replay.addEventListener('click',()=>{movie.currentTime=0;movie.play().catch(()=>{fallback.style.display='flex'})});
document.getElementById('start').addEventListener('click',()=>{fallback.style.display='none';movie.play().catch(()=>{fallback.style.display='flex'})});
movie.addEventListener('playing',()=>fallback.style.display='none');
movie.play().catch(()=>fallback.style.display='flex');sync();
</script></body></html>
